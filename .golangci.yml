version: "2"

run:
  timeout: 5m
  tests: true

linters:
  enable:
    - bodyclose
    - contextcheck
    - errcheck
    - errorlint
    - gosec
    - govet
    - ineffassign
    - misspell
    - nilerr
    - revive
    - staticcheck
    - unused
    - wrapcheck
  settings:
    revive:
      rules:
        - name: exported
          arguments:
            - checkPrivateReceivers
            - sayRepetitiveInsteadOfStutters
    gosec:
      excludes:
        - G104 # Covered by errcheck with better context
    wrapcheck:
      ignore-package-globs:
        - ec2-shell-desk/internal/*
        - ec2-shell-desk/internal/*/*
  exclusions:
    paths:
      - frontend
      - build
      - docs
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gosec
          - wrapcheck
