run:
  timeout: 5m
  tests: true

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofumpt
    - revive
    - gosec
    - misspell
    - bodyclose
    - contextcheck
    - errorlint
    - nilerr
    - wrapcheck

linters-settings:
  gofumpt:
    extra-rules: true
  revive:
    rules:
      - name: exported
        arguments:
          - checkPrivateReceivers
          - sayRepetitiveInsteadOfStutters
  gosec:
    excludes:
      - G104 # Covered by errcheck with better context
  wrapcheck:
    ignorePackageGlobs:
      - ec2-shell-desk/internal/core/domain

issues:
  exclude-dirs:
    - frontend
    - build
    - docs
  exclude-rules:
    - path: _test\.go
      linters:
        - gosec
        - wrapcheck
        - errcheck
