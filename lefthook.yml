# Git hooks configuration using Lefthook
# Install hooks with: lefthook install

commit-msg:
  commands:
    conventional-commit:
      run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/verify-commit-msg.ps1 {1}

pre-commit:
  parallel: true
  commands:
    gofumpt:
      glob: "*.go"
      run: gofumpt -l -w {staged_files} && git add {staged_files}
    golangci-lint:
      glob: "*.go"
      run: golangci-lint run ./...

pre-push:
  commands:
    test:
      run: go test ./... -race -count=1
